const ic=(name,cls='')=>`<svg class="${cls}" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.wallet}</svg>`;
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date(),tz=d.getTimezoneOffset();return new Date(d.getTime()-tz*60000).toISOString().slice(0,10)};
const amountFmt=n=>new Intl.NumberFormat('ar-EG',{maximumFractionDigits:3,minimumFractionDigits:0}).format(Math.abs(n)/1000);
const fmt=(n,unit=true)=>`${n<0?'-':''}${amountFmt(n)}${unit?` <small>${currencyLabels[data?.currency||'LYD']}</small>`:''}`;
const dateFmt=d=>new Date(d+'T12:00:00').toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'});
const nowIso=()=>new Date().toISOString();
const id=()=>window.crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2);
const sum=(arr,selector=x=>x.amount)=>arr.reduce((a,x)=>a+selector(x),0);
const tx=(type,arr=data.transactions)=>arr.filter(x=>x.type===type);
const total=(type,arr=data.transactions)=>sum(tx(type,arr));
const balance=(arr=data.transactions)=>total('save',arr)-total('withdraw',arr)+total('repay',arr);
const outstanding=(withdrawId,arr=data.transactions)=>{const w=arr.find(x=>x.id===withdrawId&&x.type==='withdraw');if(!w)return 0;return w.amount-sum(arr.filter(x=>x.type==='repay'&&x.withdrawId===withdrawId));};
const sorted=(arr=data.transactions)=>[...arr].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||''));
const intervalFilter=(items,filter)=>{const d=new Date(),thisMonth=today().slice(0,7),year=today().slice(0,4);if(filter==='today')return items.filter(x=>x.date===today());if(filter==='week'){const day=(d.getDay()+1)%7;const start=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day);const min=[start.getFullYear(),String(start.getMonth()+1).padStart(2,'0'),String(start.getDate()).padStart(2,'0')].join('-');return items.filter(x=>x.date>=min&&x.date<=today())}if(filter==='month')return items.filter(x=>x.date?.slice(0,7)===thisMonth);if(filter==='year')return items.filter(x=>x.date?.slice(0,4)===year);if(filter==='last30'){const a=new Date();a.setDate(d.getDate()-29);const min=[a.getFullYear(),String(a.getMonth()+1).padStart(2,'0'),String(a.getDate()).padStart(2,'0')].join('-');return items.filter(x=>x.date>=min&&x.date<=today())}return items};
const ratio=(n,d)=>d>0?Math.min(100,Math.round(n/d*100)):0;
const toBytes=s=>new TextEncoder().encode(s);
const b64=bytes=>btoa(String.fromCharCode(...new Uint8Array(bytes)));
const fromB64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
async function derive(password,salt,iterations){const base=await crypto.subtle.importKey('raw',toBytes(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptState(state,key){const iv=crypto.getRandomValues(new Uint8Array(12));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,toBytes(JSON.stringify(state)));return {iv:b64(iv),cipher:b64(cipher)}}
async function decryptState(v,key){const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(v.iv)},key,fromB64(v.cipher));const s=JSON.parse(new TextDecoder().decode(buf));if(!s||!Array.isArray(s.transactions)||typeof s.currency!=='string')throw Error('ملف البيانات غير صحيح');return s}
function getVault(){try{let v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');return v&&v.version===VERSION&&v.username&&v.cipher&&v.iv&&v.salt?v:null}catch{return null}}
function canSecure(){return !!window.crypto?.subtle&&!!window.crypto?.getRandomValues}
async function persist(){const sealed=await encryptState(data,cryptoKey);vault={...vault,...sealed};localStorage.setItem(STORAGE_KEY,JSON.stringify(vault))}
async function mutate(fn){if(busy)return;busy=true;try{fn();await persist();render();return true}catch(e){toast(e.message||'حدث خطأ أثناء الحفظ',true);render();return false}finally{busy=false}}
function toast(msg,error=false){let root=$('#toast-root');root.replaceChildren();let el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=msg;root.appendChild(el);setTimeout(()=>{if(el.isConnected)el.remove()},3500)}
function lock(){cryptoKey=null;data=null;modal=null;lastUnlockedAt=0;screen='home';render()}
function render(){const app=$('#app');if(!data){app.innerHTML=authHTML();$('#overlay-root').innerHTML='';return}app.innerHTML=`<div class="app-shell">${headerHTML()}<main id="main">${({home:homeHTML,history:historyHTML,debts:debtsHTML,reports:reportsHTML,settings:settingsHTML}[screen]||homeHTML)()}</main><div class="page-footer">حويشة • فلوسك ليك • بياناتك على جهازك فقط</div></div>${bottomHTML()}`;renderModal();const btn=$('#install-action');if(btn&&deferredInstall)btn.style.display='inline-flex'}
function authHTML(){const isNew=!getVault();return `<div class="auth-shell"><div><div class="auth-hero"><div class="auth-logo">ح</div><h1>حويشة<span style="color:var(--mint)">.</span></h1><p>كل جنيه أو دينار بتتعب فيه... يبقى تحت عينك.<br>مرتبك، تحويشتك، وسحوباتك في مكان واحد.</p></div><div class="auth-card"><div class="eyebrow">${isNew?'خطوتك الأولى':'أهلًا برجوعك 👋'}</div><h2>${isNew?'اعمل خزنتك الخاصة':'افتح خزنتك'}</h2><p>${isNew?'اختار اسم مستخدم وكلمة مرور. كل حسابك بيتشفّر ويتحفظ على الجهاز.':'اكتب اسم المستخدم وكلمة المرور علشان تدخل لبياناتك.'}</p><form id="auth-form"><div class="field"><label for="username">اسم المستخدم</label><input class="control" id="username" name="username" autocomplete="username" placeholder="مثلاً: ibrahim" minlength="3" required></div><div class="field"><label for="password">كلمة المرور</label><input class="control" id="password" name="password" type="password" autocomplete="${isNew?'new-password':'current-password'}" placeholder="${isNew?'8 حروف أو أرقام على الأقل':'كلمة المرور'}" minlength="${isNew?8:1}" required></div>${isNew?`<div class="field"><label for="repeat">تأكيد كلمة المرور</label><input class="control" type="password" id="repeat" name="repeat" autocomplete="new-password" required></div>`:''}<button type="submit" class="full-btn" id="auth-submit">${ic('lock')}${isNew?'إنشاء خزنتي':'دخول آمن'}</button></form><div class="small-note">${isNew?'احتفظ بكلمة المرور كويس؛ مفيش سيرفر يقدر يرجعها لو نسيتها.':'نسيت كلمة المرور؟ استرجاع الحساب ممكن فقط من نسخة احتياطية مشفرة وكلمة مرورها.'}</div><div style="margin-top:13px"><button type="button" class="outline-btn" style="width:100%" data-action="restore">${ic('upload')} استعادة نسخة احتياطية على الجهاز</button></div>${!isNew?'':`<div class="small-note danger-text" style="margin-top:8px">⚠️ لو مسحت بيانات المتصفح من غير نسخة احتياطية، سجلاتك هتضيع.</div>`}</div></div><div class="auth-foot">${ic('shield')}<div>بدون إنترنت • بدون اشتراك • بيانات مشفرة محليًا</div>${!canSecure()?'<div class="danger-text">المتصفح الحالي لا يدعم التشفير الآمن. افتح التطبيق من Chrome أو Safari حديث.</div>':''}</div></div>`}
function headerHTML(){const username=esc(vault?.username||'');return `<header class="topbar"><div class="brand"><div class="brand-mark">ح</div><div><div class="brand-name">حويشة<span class="mint-text">.</span></div><div class="brand-sub">فلوسك تحت عينك</div></div></div><div class="head-actions"><button class="install-btn" id="install-action" data-action="install">${ic('download')} تثبيت</button><button class="circle-btn" data-action="lock" aria-label="قفل الحساب" title="قفل الحساب">${ic('lock')}</button><div class="mini-avatar" title="${username}">${esc(username[0]?.toUpperCase()||'أ')}</div></div></header>`}
const nav=[['home','الرئيسية','home'],['history','الحركات','history'],['debts','السحوبات','wallet'],['reports','التقارير','chart'],['settings','الإعدادات','settings']];
function bottomHTML(){return `<nav class="bottom-nav" aria-label="التنقل الرئيسي"><div class="bottom-inner">${nav.map(([key,lab,ico])=>`<button class="nav-btn ${screen===key?'active':''}" data-view="${key}" aria-label="${lab}" aria-current="${screen===key?'page':'false'}">${ic(ico)}<span>${lab}</span></button>`).join('')}</div></nav>`}
function metric(label,value,iconName,extraClass=''){return `<div class="metric ${extraClass}"><div class="metric-icon">${ic(iconName)}</div><p class="label">${label}</p><div class="amount">${fmt(value)}</div></div>`}
function homeHTML(){const all=data.transactions, bal=balance(),earned=total('income'),dep=total('save'),out=total('withdraw'),paid=total('repay'),due=out-paid,pct=ratio(bal,data.goal),latest=sorted().slice(0,5);return `<div class="eyebrow">أهلًا يا ${esc(vault.username)} ✨</div><h1 class="page-title">كل قرش في حسابه.</h1><p class="page-sub">${new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p><section class="hero"><div class="hero-top"><span class="hero-label">رصيد تحويشتك الحالي</span><div class="hero-icon">${ic('wallet')}</div></div><div class="hero-amount">${fmt(bal)}</div><div class="hero-bottom"><span>الإيداع − السحب + اللي رجعته</span><span class="hero-chip">${all.length} حركة</span></div></section><div class="quick-actions"><button class="quick in" data-open="income"><div class="quick-icon">${ic('plus')}</div>دخل جديد</button><button class="quick save" data-open="save"><div class="quick-icon">${ic('piggy')}</div>أحوش فلوس</button><button class="quick out" data-open="withdraw"><div class="quick-icon">${ic('arrow-up-right')}</div>أسحب فلوس</button><button class="quick back" data-open="repay"><div class="quick-icon">${ic('rotate-ccw')}</div>أرجّع سحب</button></div><div class="section-heading"><h2>ملخص فلوسك</h2><button data-view="reports">شوف التقارير ${ic('chevron')}</button></div><div class="metric-grid">${metric('إجمالي اللي حوشته',dep,'piggy')}${metric('إجمالي دخلك',earned,'briefcase')}${metric('إجمالي السحوبات',out,'arrow-up-right','danger')}${metric('لسه عليك ترجع',due,'rotate-ccw','gold')}</div><section class="goal-card"><div class="goal-row"><div><h2 class="goal-title">🎯 هدف التحويش</h2><span class="goal-note">${data.goal?'فاضلك '+fmt(Math.max(0,data.goal-bal))+' على هدفك':'حط لنفسك هدف وابدأ الرحلة'}</span></div><button class="tiny-btn" data-open="goal">${data.goal?'تعديل الهدف':'حدد هدفك'}</button></div>${data.goal?`<div class="track"><div class="fill" style="width:${pct}%"></div></div><div class="goal-row"><span class="goal-note">${fmt(bal)} من ${fmt(data.goal)}</span><span class="goal-value">${pct}%</span></div>`:''}</section><div class="section-heading"><h2>آخر الحركات</h2><button data-view="history">كل الحركات ${ic('chevron')}</button></div><div class="transactions">${latest.length?latest.map(t=>transactionHTML(t,false)).join(''):empty('لسه مفيش حركات','ابدأ بإضافة مرتب أو مبلغ اتحوش وهنرتب لك الدنيا.')}</div>`}
function empty(title,subtitle){return `<div class="empty"><span class="empty-emoji">🌱</span><strong>${title}</strong><div>${subtitle}</div></div>`}
function transactionHTML(t,showMenu=true){const name=t.type==='income'?`دخل من ${t.source==='salary'?'المرتب':'شغل برّه'}`:t.type==='save'?`تحويش من ${t.source==='salary'?'المرتب':'شغل برّه'}`:t.type==='withdraw'?`سحب • ${esc(t.reason||'بدون سبب')}`:`إرجاع مبلغ مسحوب`;const sub=[dateFmt(t.date),t.type==='income'?cycleLabels[t.cycle||'once']:null,t.note?esc(t.note):null].filter(Boolean).join(' • ');const amountClass=t.type==='withdraw'?'negative':t.type==='income'?'neutral':'positive';const amountSign=t.type==='withdraw'?'-':t.type==='save'||t.type==='repay'?'+':'';return `<div><div class="tx-item"><div class="tx-icon ${t.type}">${ic(typeIcons[t.type])}</div><div class="tx-details"><div class="tx-title">${name}</div><div class="tx-meta">${sub}</div></div><div class="tx-right"><div class="tx-amount ${amountClass}">${amountSign}${fmt(t.amount)}</div>${showMenu?`<button class="tx-menu" data-expand="${esc(t.id)}" aria-label="إجراءات الحركة">${ic('more')}</button>`:''}</div></div>${showMenu&&expandedTransaction===t.id?`<div class="tx-more"><button class="ghost-btn" data-edit="${esc(t.id)}">${ic('edit')} تعديل</button><button class="danger-btn" data-delete="${esc(t.id)}">${ic('trash')} حذف</button></div>`:''}</div>`}
function historyHTML(){const arr=filteredHistory();return `<h1 class="page-title">سجل الحركات</h1><p class="page-sub">كل مبلغ دخل أو اتحوش أو اتسحب أو رجعته.</p><div class="searchbar">${ic('search')}<input id="history-search" placeholder="دور بالوصف أو الملاحظات..." value="${esc(historyQuery)}" autocomplete="off"></div><div class="filter-row">${[['all','الكل'],['income','الدخل'],['save','التحويش'],['withdraw','السحب'],['repay','الاسترداد']].map(([k,t])=>`<button class="pill ${historyFilter===k?'active':''}" data-history-filter="${k}">${t}</button>`).join('')}</div><p class="list-total" id="hist-count">${arr.length} حركة</p><div class="transactions" id="hist-items">${arr.length?arr.map(x=>transactionHTML(x)).join(''):empty('مفيش نتائج','جرب فلتر تاني أو سجّل حركة جديدة.')}</div><button class="full-btn" style="margin-top:19px" data-open="chooser">${ic('plus')} إضافة حركة جديدة</button>`}
function filteredHistory(){return sorted().filter(t=>(historyFilter==='all'||t.type===historyFilter)&&(!historyQuery||[t.note||'',t.reason||'',typeLabels[t.type],sourceLabels[t.source]||'',cycleLabels[t.cycle]||''].join(' ').toLowerCase().includes(historyQuery.toLowerCase())))}
function updateHistory(){const arr=filteredHistory(),target=$('#hist-items');if(target){target.innerHTML=arr.length?arr.map(x=>transactionHTML(x)).join(''):empty('مفيش نتائج','جرّب كلمة تانية أو فلتر مختلف.');$('#hist-count').textContent=arr.length+' حركة'}}
function debtsHTML(){const list=sorted(tx('withdraw')),due=sum(list,w=>outstanding(w.id)),returned=total('repay');return `<h1 class="page-title">مسحوباتك</h1><p class="page-sub">عارف سحبت كام، ورجّعت كام، وإيه اللي لسه ناقص.</p><div class="metric-strip"><div class="tiny-stat"><div class="t">الباقي ترجّعه</div><div class="v gold-text">${fmt(due)}</div></div><div class="tiny-stat"><div class="t">اللي رجّعته فعلًا</div><div class="v mint-text">${fmt(returned)}</div></div></div><div class="section-heading"><h2>متابعة كل سحب</h2><button data-open="withdraw">+ سحب جديد</button></div>${list.length?list.map(w=>{const left=outstanding(w.id),returned=w.amount-left,pr=ratio(returned,w.amount);return `<article class="debt-card"><div class="debt-head"><div><div class="debt-title">${esc(w.reason||'سحب من التحويشة')}</div><div class="debt-sub">${dateFmt(w.date)}${w.note?' • '+esc(w.note):''}</div></div><div class="debt-amount">${fmt(w.amount)}</div></div><div class="debt-p"><span>اترجع: <strong>${fmt(returned)}</strong></span><span class="status-tag ${left===0?'done':''}">${left===0?'✓ اترد كامل':'باقي '+fmt(left)}</span></div><div class="debt-bar"><div style="width:${pr}%"></div></div><div class="debt-actions"><button class="tiny-btn" data-repay="${esc(w.id)}" ${left===0?'disabled':''}>${left===0?'تم التسديد':'+ إرجاع جزء / الكل'}</button></div></article>`}).join(''):empty('مفيش سحوبات','جميل! لما تسحب مبلغ هتلاقيه هنا وتقدر ترجعه على دفعات.')}`}
function monthKeys(){const keys=[];const d=new Date();for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);keys.push([x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'),x.toLocaleDateString('ar-EG',{month:'short'})])}return keys}
function reportChart(){const keys=monthKeys(),bars=keys.map(([key,label])=>({key,label,s:sum(data.transactions.filter(t=>t.type==='save'&&t.date.slice(0,7)===key)),w:sum(data.transactions.filter(t=>t.type==='withdraw'&&t.date.slice(0,7)===key)),r:sum(data.transactions.filter(t=>t.type==='repay'&&t.date.slice(0,7)===key))})),max=Math.max(1000,...bars.flatMap(o=>[o.s,o.w,o.r]));return `<div class="panel"><div class="chart-label">الحركة خلال آخر ٦ شهور</div><div class="chart-legend"><span class="legend">تحويش</span><span class="legend out">سحب</span><span class="legend repay">استرداد</span></div><div class="chart-wrap">${bars.map(b=>`<div class="chart-col"><div class="bars"><div class="bar" title="تحويش: ${amountFmt(b.s)}" style="height:${Math.max(3,b.s/max*100)}%"></div><div class="bar out" title="سحب: ${amountFmt(b.w)}" style="height:${Math.max(3,b.w/max*100)}%"></div><div class="bar repay" title="مُرجع: ${amountFmt(b.r)}" style="height:${Math.max(3,b.r/max*100)}%"></div></div><div class="chart-month">${b.label}</div></div>`).join('')}</div><div class="small-note">الرسم لآخر ٦ شهور بغض النظر عن فلتر التقرير.</div></div>`}

function renderModal(){const root=$('#overlay-root');if(!modal){root.innerHTML='';return}const t=modal.id?data.transactions.find(x=>x.id===modal.id):null;const editing=!!t;let inner='',title='';if(modal.type==='chooser'){title='تحب تسجل إيه؟';inner=`<div class="quick-actions" style="grid-template-columns:repeat(2,1fr);margin:0">${[['income','دخل جديد','in','plus'],['save','مبلغ اتحوش','save','piggy'],['withdraw','سحب فلوس','out','arrow-up-right'],['repay','إرجاع سحب','back','rotate-ccw']].map(([type,txt,cl,iconName])=>`<button class="quick ${cl}" data-open="${type}"><span class="quick-icon">${ic(iconName)}</span>${txt}</button>`).join('')}</div>`}
else if(['income','save','withdraw','repay'].includes(modal.type)){
const kind=modal.type,titleMap={income:'تسجيل دخل جديد',save:'ضيف لتحويشتك',withdraw:'سحب من التحويشة',repay:'إرجاع مبلغ مسحوب'};title=editing?'تعديل الحركة':titleMap[kind];const choices=[['salary','مرتب الشغل'],['extra','شغل من برّه']];const selectedWithdraw=editing?t.withdrawId:modal.withdrawId;let fields=amountField(moneyInput(t?.amount))+'<div class="form-row">';
if(kind==='income'||kind==='save')fields+=optionSelect('source','مصدر الفلوس',choices,t?.source||'salary');

fields+='</div>';
if(kind==='repay'){const choices=sorted(tx('withdraw')).filter(x=>outstanding(x.id)>0||x.id===selectedWithdraw).map(x=>[x.id,`${dateFmt(x.date)} — ${x.reason||'سحب'} — باقي ${amountFmt(outstanding(x.id))} ${currencyLabels[data.currency]}`]);if(!choices.length){inner=empty('مفيش سحوبات مفتوحة','أول ما تسحب هتقدر ترجع المبلغ هنا.');root.innerHTML=modalShell(title,inner);return}fields+=optionSelect('withdrawId','السحب اللي بترجع منه',choices,selectedWithdraw||choices[0][0]);}

fields+=smallDate(t?.date||today())+noteArea(t?.note||'');inner=`<form id="transaction-form">${fields}${formFoot(editing?'حفظ التعديل':'تسجيل الحركة')}</form>`;
}
else if(modal.type==='goal'){title='هدفك الجديد 🎯';inner=`<form id="goal-form">${amountField(moneyInput(data.goal),'goal','عايز تحوّش كام؟') }<div class="micro-card">كل ما رصيدك يزيد، شريط الهدف هيقرب لحد 100%.</div>${formFoot('حفظ الهدف')}</form>`}

root.innerHTML=modalShell(title,inner);setTimeout(()=>{const el=root.querySelector('input,select,button[data-open]');el?.focus({preventScroll:true})},0)}
function openModal(type,idValue,withdrawId){modal={type,id:idValue,withdrawId};renderModal()}
function closeModal(){modal=null;renderModal()}
const parseAmount=(value,allowZero=false)=>{const n=String(value||'').trim();if(!/^\d+(\.\d{1,3})?$/.test(n))throw Error('اكتب مبلغ صحيح، بحد أقصى 3 أرقام بعد العلامة');const v=Math.round(Number(n)*1000);if(!Number.isSafeInteger(v)||v<0||(!allowZero&&v===0))throw Error('اكتب مبلغ أكبر من صفر');return v};
function validDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||Number.isNaN(new Date(v+'T12:00:00').getTime())||new Date(v+'T12:00:00').toISOString().slice(0,10)!==v)throw Error('تاريخ غير صحيح');return v}
function buildTransaction(f){const type=modal.type,old=modal.id?data.transactions.find(x=>x.id===modal.id):null;const value=parseAmount(f.get('amount'));const date=validDate(f.get('date'));const obj={id:old?.id||id(),type,amount:value,date,note:String(f.get('note')||'').trim().slice(0,160),createdAt:old?.createdAt||nowIso()};if(type==='income'||type==='save'){obj.source=['salary','extra'].includes(f.get('source'))?f.get('source'):'salary'}if(type==='income')obj.cycle=['day','week','once'].includes(f.get('cycle'))?f.get('cycle'):'once';if(type==='withdraw')obj.reason=String(f.get('reason')||'أخرى').slice(0,50);if(type==='repay')obj.withdrawId=String(f.get('withdrawId')||'');return obj}
async function saveTransaction(f){try{const item=buildTransaction(f),editing=!!modal.id,old=editing?data.transactions.find(x=>x.id===modal.id):null,saveNow=item.type==='income'&&!editing&&f.get('savedNow')?parseAmount(f.get('savedNow')):0;if(saveNow>item.amount)throw Error('المبلغ اللي بتحوشه مينفعش يزيد عن الدخل اللي سجلته');if(item.type==='income'&&editing){const linked=sum(data.transactions.filter(t=>t.type==='save'&&t.linkedIncomeId===item.id));if(linked>item.amount)throw Error('الدخل الجديد أقل من المبلغ اللي تحوّش منه. عدّل التحويش المرتبط الأول')}if(item.type==='withdraw'){const already=sum(data.transactions.filter(t=>t.type==='repay'&&t.withdrawId===item.id));if(item.amount<already)throw Error('قيمة السحب الجديدة أقل من اللي اترجع منه بالفعل')}
if(item.type==='repay'){const w=data.transactions.find(x=>x.id===item.withdrawId&&x.type==='withdraw');if(!w)throw Error('اختر سحبًا موجودًا');const remaining=outstanding(w.id)+(old?.type==='repay'&&old.withdrawId===w.id?old.amount:0);if(item.amount>remaining)throw Error('المبلغ أكبر من اللي باقي من السحب: '+amountFmt(remaining))}
const proposed=data.transactions.filter(t=>t.id!==item.id).concat(item);if(saveNow)proposed.push({id:id(),type:'save',source:item.source,amount:saveNow,date:item.date,note:'تحويش من دخل مُسجّل'+(item.note?' • '+item.note:''),createdAt:nowIso(),linkedIncomeId:item.id});if(balance(proposed)<0)throw Error('العملية هتخلي رصيد التحويشة بالسالب؛ راجع المبلغ');const ok=await mutate(()=>{data.transactions=proposed});if(ok){closeModal();toast(editing?'اتحفظ التعديل بنجاح ✓':'اتسجلت الحركة بنجاح ✓');}}catch(e){toast(e.message,true)}}
let authBusy=false;
async function submitAuth(form){if(authBusy)return;if(!canSecure()){toast('لا يمكن تشغيل التشفير في المتصفح الحالي. افتحه في Chrome أو Safari حديث.',true);return}const fields=new FormData(form),username=String(fields.get('username')||'').trim(),password=String(fields.get('password')||'');authBusy=true;const button=$('#auth-submit');button.disabled=true;button.textContent='جارٍ فتح الخزنة...';try{const existing=getVault();if(!existing){if(username.length<3)throw Error('اسم المستخدم لازم يكون 3 حروف على الأقل');if(password.length<8)throw Error('كلمة المرور لازم تكون 8 حروف على الأقل');if(password!==String(fields.get('repeat')||''))throw Error('تأكيد كلمة المرور مش مطابق');const salt=crypto.getRandomValues(new Uint8Array(16));const key=await derive(password,salt,ITERATIONS);vault={version:VERSION,username,salt:b64(salt),iterations:ITERATIONS};cryptoKey=key;data=defaultData();await persist();}else{if(username.toLowerCase()!==String(existing.username).toLowerCase())throw Error('اسم المستخدم أو كلمة المرور غير صحيحة');const key=await derive(password,fromB64(existing.salt),existing.iterations);let state;try{state=await decryptState(existing,key)}catch{throw Error('اسم المستخدم أو كلمة المرور غير صحيحة')}cryptoKey=key;vault=existing;data=state;}lastUnlockedAt=Date.now();render();toast('أهلًا بيك في حويشة 💚')}catch(e){toast(e.message||'تعذر فتح الخزنة',true);const btn=$('#auth-submit');if(btn){btn.disabled=false;btn.innerHTML=ic('lock')+(getVault()?'دخول آمن':'إنشاء خزنتي')}}finally{authBusy=false}}
function downloadable(name,content,mime){const b=new Blob([content],{type:mime}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function exportBackup(){const v=getVault();if(!v)throw Error('مش لاقي بيانات الحساب');downloadable('hawisha-backup-'+today()+'.json',JSON.stringify({format:BACKUP_FORMAT,exportedAt:nowIso(),vault:v},null,2),'application/json');toast('النسخة المشفرة اتجهزت • احتفظ بكلمة مرورها')}
function csvQuote(v){let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
function exportCSV(){const arr=sorted(intervalFilter(data.transactions,reportFilter));const rows=[['التاريخ','النوع','المصدر','النظام','السبب','المبلغ','العملة','ملاحظات','رقم السحب المرتبط'],...arr.map(t=>[t.date,typeLabels[t.type],sourceLabels[t.source]||'',cycleLabels[t.cycle]||'',t.reason||'',(t.amount/1000).toFixed(3),data.currency,t.note||'',t.withdrawId||''])];downloadable('hawisha-report-'+today()+'.csv','\ufeff'+rows.map(row=>row.map(csvQuote).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('تم تجهيز ملف التقرير CSV')}
function importBackup(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const file=input.files?.[0];if(!file)return;if(file.size>8*1024*1024)throw Error('النسخة كبيرة جدًا');const obj=JSON.parse(await file.text());const v=obj?.vault;if(obj.format!==BACKUP_FORMAT||!v||v.version!==VERSION||!v.username||typeof v.cipher!=='string'||typeof v.iv!=='string'||typeof v.salt!=='string'||!Number.isSafeInteger(v.iterations)||v.iterations<100000||v.iterations>1000000)throw Error('ملف النسخة الاحتياطية غير صحيح');if(!confirm('استعادة النسخة هتستبدل الحساب والبيانات الحالية، وهتحتاج اسم المستخدم وكلمة مرور النسخة. موافق؟'))return;localStorage.setItem(STORAGE_KEY,JSON.stringify(v));lock();toast('النسخة اتستعادت. ادخل بيانات الحساب الموجود فيها.')}catch(e){toast(e.message||'تعذر استعادة النسخة',true)}};input.click()}
function deleteTransaction(txid){const item=data.transactions.find(t=>t.id===txid);if(!item)return;if(item.type==='withdraw'&&data.transactions.some(t=>t.type==='repay'&&t.withdrawId===txid)){toast('احذف حركات إرجاع السحب المرتبطة الأول',true);return}const linked=item.type==='income'?data.transactions.filter(t=>t.type==='save'&&t.linkedIncomeId===txid):[];const linkedIds=new Set(linked.map(t=>t.id));const updated=data.transactions.filter(t=>t.id!==txid&&!linkedIds.has(t.id));if(balance(updated)<0){toast('الحذف هيخلي الرصيد بالسالب؛ عدل أو احذف السحوبات الأول',true);return}if(!confirm(linked.length?'حذف الدخل ده هيحذف معاه التحويش المرتبط بيه ('+linked.length+' حركة). متأكد؟':'متأكد إنك عايز تحذف الحركة دي؟ الحذف لا يمكن التراجع عنه.'))return;mutate(()=>{data.transactions=updated;expandedTransaction=null}).then(ok=>{if(ok)toast('اتحذفت الحركة')})}
function currencySave(f){const next=f.get('currency');if(!currencyLabels[next])return toast('عملة غير مدعومة',true);if(next!==data.currency&&data.transactions.length&&!confirm('مهم: هيتغير رمز العملة فقط، من غير تحويل أي مبلغ. متأكد؟'))return;mutate(()=>{data.currency=next}).then(ok=>{if(ok){closeModal();toast('اتحدثت العملة')}})}
async function passwordSave(f){const old=String(f.get('old')||''),newPass=String(f.get('new')||''),confirmPass=String(f.get('confirm')||'');if(newPass.length<8)throw Error('كلمة المرور الجديدة لازم تكون 8 أحرف على الأقل');if(newPass!==confirmPass)throw Error('كلمة المرور الجديدة وتأكيدها مش متطابقين');try{const oldKey=await derive(old,fromB64(vault.salt),vault.iterations);await decryptState(vault,oldKey)}catch{throw Error('كلمة المرور القديمة غير صحيحة')}const salt=crypto.getRandomValues(new Uint8Array(16));const key=await derive(newPass,salt,ITERATIONS);const sealed=await encryptState(data,key);const newVault={...vault,salt:b64(salt),iterations:ITERATIONS,...sealed};localStorage.setItem(STORAGE_KEY,JSON.stringify(newVault));vault=newVault;cryptoKey=key;closeModal();toast('تم تغيير كلمة المرور وتشفير البيانات من جديد')}
async function wipe(f){if(String(f.get('confirmation')||'').trim()!=='حذف')throw Error('لازم تكتب كلمة حذف بالضبط');if(!confirm('تأكيد نهائي: حذف الحساب وكل بياناته من الجهاز؟'))return;localStorage.removeItem(STORAGE_KEY);lock();toast('اتحذف الحساب من الجهاز')}
function changeView(view){if(!nav.some(x=>x[0]===view))return;screen=view;modal=null;expandedTransaction=null;render();window.scrollTo({top:0,behavior:'instant'})}
function eventHandler(ev){const button=ev.target.closest('[data-action],[data-view],[data-open],[data-close],[data-history-filter],[data-report-filter],[data-expand],[data-edit],[data-delete],[data-repay]');if(!button)return;if(button.hasAttribute('data-view'))return changeView(button.dataset.view);if(button.hasAttribute('data-close'))return closeModal();if(button.hasAttribute('data-open'))return openModal(button.dataset.open);if(button.hasAttribute('data-history-filter')){historyFilter=button.dataset.historyFilter;expandedTransaction=null;render();return}if(button.hasAttribute('data-report-filter')){reportFilter=button.dataset.reportFilter;render();return}if(button.hasAttribute('data-expand')){expandedTransaction=expandedTransaction===button.dataset.expand?null:button.dataset.expand;render();return}if(button.hasAttribute('data-edit')){const t=data.transactions.find(t=>t.id===button.dataset.edit);if(t)openModal(t.type,t.id);return}if(button.hasAttribute('data-delete'))return deleteTransaction(button.dataset.delete);if(button.hasAttribute('data-repay'))return openModal('repay',null,button.dataset.repay);const action=button.dataset.action;if(action==='lock')lock();if(action==='backup')exportBackup();if(action==='restore')importBackup();if(action==='csv')exportCSV();if(action==='install'&&deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;render()})}}
document.addEventListener('click',eventHandler);
document.addEventListener('input',e=>{if(e.target.id==='history-search'){historyQuery=e.target.value;expandedTransaction=null;updateHistory()}});
document.addEventListener('submit',async ev=>{ev.preventDefault();const form=ev.target,f=new FormData(form);if(busy)return;try{if(form.id==='auth-form'){await submitAuth(form);return}if(form.id==='transaction-form')return await saveTransaction(f);if(form.id==='goal-form'){const val=parseAmount(f.get('goal'),true);const ok=await mutate(()=>data.goal=val);if(ok){closeModal();toast('هدف التحويش اتحفظ ✓')}return}if(form.id==='currency-form')return currencySave(f);if(form.id==='password-form')return await passwordSave(f);if(form.id==='wipe-form')return await wipe(f)}catch(e){toast(e.message,true)}});
document.addEventListener('click',e=>{if(e.target.id==='screen-overlay')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')lastUnlockedAt=Date.now();else if(data&&lastUnlockedAt&&Date.now()-lastUnlockedAt>lockAfterMs){lock();toast('الخزنة اتقفلت لحماية بياناتك')}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;const btn=$('#install-action');if(btn)btn.style.display='inline-flex'});
window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('حويشة اتثبتت على الجهاز 🎉')});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
})();
</script>
